<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tickets y Mesas - La Piruleta TPV</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Epilogue', sans-serif; -webkit-tap-highlight-color: transparent; }</style>
</head>
<body class="bg-[#fff8f5] text-stone-800 antialiased select-none pb-24">
  
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-stone-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <a href="index.html" class="p-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <div>
        <h1 class="font-bold text-sm text-stone-900 leading-tight">Tickets Abiertos y Mesas</h1>
        <p class="text-[11px] text-stone-500">0 comandas activas • Total: 0,00 €</p>
      </div>
    </div>
    <a href="04-plano-mesas.html" class="px-3 py-1.5 rounded-xl bg-emerald-50 text-[#1b7a4a] border border-emerald-200 font-bold text-xs flex items-center gap-1.5">
      <i data-lucide="map" class="w-4 h-4"></i>
      <span>Ver Plano</span>
    </a>
  </header>

  <main class="p-4 max-w-lg mx-auto space-y-4">
    <!-- ESTADO VACÍO (SIN TICKETS / COMANDAS DE EJEMPLO) -->
    <div class="bg-white border-2 border-dashed border-stone-200 rounded-3xl p-8 text-center space-y-4 shadow-sm my-6">
      <div class="w-16 h-16 mx-auto bg-stone-50 border border-stone-200 rounded-2xl flex items-center justify-center text-stone-400">
        <i data-lucide="receipt" class="w-8 h-8 text-stone-400"></i>
      </div>
      <div class="space-y-1">
        <h3 class="font-bold text-base text-stone-900">No hay tickets abiertos</h3>
        <p class="text-xs text-stone-500 max-w-xs mx-auto leading-relaxed">
          Actualmente no hay mesas ocupadas ni comandas pendientes de cobro.
        </p>
      </div>
      <div class="flex flex-col sm:flex-row gap-2 justify-center pt-2">
        <a href="index.html" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-[#1b7a4a] hover:bg-[#15613b] text-white text-xs font-bold rounded-xl shadow transition-colors">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>Abrir nueva comanda</span>
        </a>
        <a href="04-plano-mesas.html" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-bold rounded-xl transition-colors">
          <i data-lucide="layout-grid" class="w-4 h-4"></i>
          <span>Asignar mesa en plano</span>
        </a>
      </div>
    </div>
  </main>

  <!-- NAVEGACIÓN INFERIOR (TABS) -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-stone-200 px-3 py-2 flex items-center justify-around">
    <a href="index.html" class="flex flex-col items-center gap-0.5 text-stone-400 hover:text-stone-700">
      <i data-lucide="calculator" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Ventas</span>
    </a>
    <a href="03-tickets-mesas.html" class="flex flex-col items-center gap-0.5 text-[#1b7a4a]">
      <i data-lucide="receipt" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold">Tickets</span>
    </a>
    <a href="04-plano-mesas.html" class="flex flex-col items-center gap-0.5 text-stone-400 hover:text-stone-700">
      <i data-lucide="layout-grid" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Mesas</span>
    </a>
    <a href="10-catalogo-stock.html" class="flex flex-col items-center gap-0.5 text-stone-400 hover:text-stone-700">
      <i data-lucide="package" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Catálogo</span>
    </a>
    <a href="05-cierre-caja.html" class="flex flex-col items-center gap-0.5 text-stone-400 hover:text-stone-700">
      <i data-lucide="banknote" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Caja</span>
    </a>
  </nav>

  <script>lucide.createIcons();</script>
</body>
</html>

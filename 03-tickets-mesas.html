<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tickets y Mesas - La Piruleta TPV</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Epilogue', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-[#fff8f5] text-stone-800 antialiased select-none pb-24">

  <!-- CABECERA -->
  <header class="sticky top-0 z-40 bg-[#1b7a4a] text-white px-4 py-2.5 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <a href="index.html" class="p-1.5 rounded-xl bg-emerald-900/50 hover:bg-emerald-900/80 text-white transition-colors">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <div>
        <h1 class="font-bold text-sm tracking-tight leading-tight">Tickets Abiertos y Mesas</h1>
        <p id="subtitulo-comandas" class="text-[11px] text-emerald-100 font-medium">0 comandas activas • Total: 0,00 €</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="04-plano-mesas.html" class="px-3 py-1.5 rounded-xl bg-white text-[#1b7a4a] font-bold text-xs flex items-center gap-1.5 shadow-sm hover:bg-emerald-50 transition-colors">
        <i data-lucide="layout-grid" class="w-4 h-4"></i>
        <span>Ver Plano</span>
      </a>
      <a href="index.html" class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs flex items-center gap-1.5 shadow-sm transition-colors">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Nueva Venta</span>
      </a>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="p-4 max-w-4xl mx-auto space-y-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="font-extrabold text-sm text-stone-900">Comandas y Tickets en Curso</span>
        <span id="badge-contador" class="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800">0</span>
      </div>
      <button type="button" onclick="descartarTodos()" id="btn-descartar-todos" class="text-xs text-rose-600 hover:text-rose-700 font-bold hidden items-center gap-1">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        <span>Descartar todos</span>
      </button>
    </div>

    <!-- LISTADO DE TICKETS APARCADOS -->
    <div id="lista-tickets" class="space-y-3">
    </div>
  </main>

  <!-- NAVEGACIÓN INFERIOR PERSISTENTE (FOOTER UNIFICADO) -->
  <footer class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-stone-200 px-5 py-2 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-6">
      <a href="index.html" class="flex items-center gap-1.5 text-stone-500 hover:text-stone-800 font-semibold text-xs">
        <i data-lucide="calculator" class="w-3.5 h-3.5"></i>
        <span>Ventas TPV</span>
      </a>
      <a href="03-tickets-mesas.html" class="flex items-center gap-1.5 text-[#1b7a4a] font-bold text-xs bg-emerald-50 px-2.5 py-1 rounded-xl border border-emerald-200">
        <i data-lucide="receipt" class="w-3.5 h-3.5"></i>
        <span>Tickets Abiertos</span>
      </a>
      <a href="04-plano-mesas.html" class="flex items-center gap-1.5 text-stone-500 hover:text-stone-800 font-semibold text-xs">
        <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
        <span>Plano de Mesas</span>
      </a>
      <a href="05-cierre-caja.html" class="flex items-center gap-1.5 text-stone-500 hover:text-stone-800 font-semibold text-xs">
        <i data-lucide="banknote" class="w-3.5 h-3.5"></i>
        <span>Caja / Turno</span>
      </a>
      <a href="10-catalogo-stock.html" class="flex items-center gap-1.5 text-stone-500 hover:text-stone-800 font-semibold text-xs">
        <i data-lucide="package" class="w-3.5 h-3.5"></i>
        <span>Catálogo</span>
      </a>
    </div>
    <div class="text-[11px] text-stone-400 flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
      <span>Terminal Conectada • Venta Directa</span>
    </div>
  </footer>

  <script>
    function obtenerTicketsPendientes() {
      try {
        return JSON.parse(localStorage.getItem('lapiruleta_tickets_pendientes') || '[]');
      } catch (e) {
        return [];
      }
    }

    function renderizarTickets() {
      const lista = document.getElementById('lista-tickets');
      const subtitulo = document.getElementById('subtitulo-comandas');
      const badge = document.getElementById('badge-contador');
      const btnDescartar = document.getElementById('btn-descartar-todos');
      const tickets = obtenerTicketsPendientes();

      badge.textContent = tickets.length;

      if (tickets.length === 0) {
        subtitulo.textContent = '0 comandas activas • Total: 0,00 €';
        btnDescartar.classList.add('hidden');
        btnDescartar.classList.remove('flex');
        lista.innerHTML = `
          <div class="bg-white rounded-3xl border-2 border-dashed border-stone-200 p-10 text-center space-y-4 shadow-xs">
            <div class="w-14 h-14 rounded-2xl bg-amber-50 border border-amber-200/80 mx-auto flex items-center justify-center text-amber-600">
              <i data-lucide="receipt" class="w-7 h-7"></i>
            </div>
            <div>
              <h3 class="font-extrabold text-base text-stone-900">No hay tickets abiertos</h3>
              <p class="text-xs text-stone-400 mt-1 max-w-sm mx-auto">Actualmente no hay comandas pendientes de cobro ni pedidos aparcados.</p>
            </div>
            <div class="pt-2 flex flex-wrap justify-center gap-2">
              <a href="index.html" class="px-4 py-2.5 rounded-xl bg-[#1b7a4a] text-white text-xs font-bold shadow hover:bg-[#15613b] transition-colors flex items-center gap-1.5">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Abrir nueva comanda</span>
              </a>
              <a href="04-plano-mesas.html" class="px-4 py-2.5 rounded-xl bg-stone-100 text-stone-700 text-xs font-bold hover:bg-stone-200 transition-colors flex items-center gap-1.5">
                <i data-lucide="layout-grid" class="w-4 h-4"></i>
                <span>Asignar mesa en plano</span>
              </a>
            </div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      btnDescartar.classList.remove('hidden');
      btnDescartar.classList.add('flex');

      let sumaTotal = 0;
      tickets.forEach(t => { sumaTotal += parseFloat(t.total || 0); });
      subtitulo.textContent = `${tickets.length} comanda${tickets.length > 1 ? 's' : ''} activa${tickets.length > 1 ? 's' : ''} • Total: ${sumaTotal.toFixed(2)} €`;

      lista.innerHTML = tickets.map(t => {
        const lineasHtml = (t.lineas || []).map(l => `
          <div class="flex items-center justify-between text-xs py-0.5">
            <span class="text-stone-700 font-medium"><strong class="text-stone-900 mr-1">${l.cant}x</strong> ${l.nombre}</span>
            <span class="text-stone-900 font-bold">${(l.precio * l.cant).toFixed(2)} €</span>
          </div>
        `).join('');

        const totalArts = (t.lineas || []).reduce((acc, it) => acc + (parseInt(it.cant, 10) || 1), 0);

        return `
          <div class="bg-white rounded-2xl border border-stone-200 shadow-sm p-4 space-y-3 transition-all hover:border-stone-300">
            <div class="flex items-start justify-between border-b border-stone-100 pb-2.5">
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-black text-sm text-stone-900">${t.numero || '#T-001'}</span>
                  <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold bg-amber-100 text-amber-800 uppercase tracking-wider">${t.ubicacion || 'BARRA'}</span>
                  <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-stone-100 text-stone-500">Abierto</span>
                </div>
                <div class="flex items-center gap-2 text-[11px] text-stone-400 mt-1">
                  <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                  <span>${t.hora || 'Hace unos minutos'}</span>
                  <span>•</span>
                  <span>${totalArts} artículo${totalArts > 1 ? 's' : ''}</span>
                </div>
              </div>
              <button type="button" onclick="eliminarComanda('${t.id}')" title="Descartar comanda" class="p-1.5 rounded-lg text-stone-400 hover:text-rose-600 hover:bg-rose-50 transition-colors">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="bg-stone-50/70 rounded-xl p-2.5 space-y-1 divide-y divide-stone-100">
              ${lineasHtml}
            </div>

            <div class="flex items-center justify-between pt-1">
              <div>
                <span class="text-[10px] font-bold text-stone-400 uppercase tracking-wider block">TOTAL TICKET</span>
                <span class="text-xl font-black text-[#1b7a4a]">${parseFloat(t.total).toFixed(2)} €</span>
              </div>
              <div class="flex items-center gap-2">
                <button type="button" onclick="recuperarComanda('${t.id}')" class="px-3.5 py-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-xs font-bold flex items-center gap-1.5 transition-colors shadow-2xs">
                  <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                  <span>Editar / +</span>
                </button>
                <button type="button" onclick="cobrarComandaDirecta('${t.id}')" class="px-4 py-2 rounded-xl bg-[#1b7a4a] hover:bg-[#15613b] text-white text-xs font-bold flex items-center gap-1.5 shadow transition-colors">
                  <i data-lucide="credit-card" class="w-3.5 h-3.5"></i>
                  <span>Cobrar</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // RECUPERAR COMANDA Y CARGARLA LIMPIA EN INDEX.HTML
    function recuperarComanda(id) {
      let tickets = obtenerTicketsPendientes();
      const ticket = tickets.find(t => t.id === id);
      if (!ticket) return;

      // 1. Quitar el ticket de pendientes para que NO se quede duplicado ni aparcado
      tickets = tickets.filter(t => t.id !== id);
      localStorage.setItem('lapiruleta_tickets_pendientes', JSON.stringify(tickets));

      // 2. Guardar el ticket para que index.html lo cargue de inmediato en su mostrador
      localStorage.setItem('lapiruleta_ticket_activo', JSON.stringify(ticket));

      // 3. Redirigir a la pantalla de cobro/ventas
      window.location.href = 'index.html';
    }

    function cobrarComandaDirecta(id) {
      recuperarComanda(id);
    }

    function eliminarComanda(id) {
      if (!confirm('¿Deseas descartar esta comanda pendiente?')) return;
      let tickets = obtenerTicketsPendientes();
      tickets = tickets.filter(t => t.id !== id);
      localStorage.setItem('lapiruleta_tickets_pendientes', JSON.stringify(tickets));
      renderizarTickets();
    }

    function descartarTodos() {
      if (!confirm('¿Seguro que deseas vaciar todas las comandas pendientes?')) return;
      localStorage.removeItem('lapiruleta_tickets_pendientes');
      renderizarTickets();
    }

    renderizarTickets();
  </script>
</body>
</html>

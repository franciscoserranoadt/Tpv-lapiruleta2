<script>
  let currentRawCents = 3500; // 35.00 € por defecto
  let movementMode = 'OUT'; // 'IN' o 'OUT'
  const initialDrawerCash = 415.40;

  function updateDisplay() {
    const amountEuros = (currentRawCents / 100).toFixed(2).replace('.', ',');
    const numericEuros = currentRawCents / 100;
    
    document.getElementById('amount-display').textContent = amountEuros;
    
    const diffSign = movementMode === 'OUT' ? '-' : '+';
    const finalBalance = movementMode === 'OUT' ? (initialDrawerCash - numericEuros) : (initialDrawerCash + numericEuros);
    
    document.getElementById('result-balance').textContent = finalBalance.toFixed(2).replace('.', ',') + ' €';
    document.getElementById('diff-tag').textContent = `(${diffSign}${amountEuros} €)`;
    
    const btnSubmitAmount = document.getElementById('btn-submit-amount');
    btnSubmitAmount.textContent = `${diffSign}${amountEuros} €`;
  }

  function keyPress(key) {
    if (key === 'C') {
      currentRawCents = 0;
    } else if (key === 'DEL') {
      currentRawCents = Math.floor(currentRawCents / 10);
    } else {
      const num = parseInt(key, 10);
      if (currentRawCents < 999999) { // límite de seguridad
        currentRawCents = currentRawCents * 10 + num;
      }
    }
    updateDisplay();
  }

  function quickAmount(euros) {
    currentRawCents = euros * 100;
    updateDisplay();
  }

  function setMovementType(type) {
    movementMode = type;
    const btnIn = document.getElementById('btn-tab-in');
    const btnOut = document.getElementById('btn-tab-out');
    const badgeLabel = document.getElementById('badge-movement-label');
    const displaySign = document.getElementById('display-sign');
    const submitBtn = document.getElementById('btn-submit');
    const submitText = document.getElementById('btn-submit-text');
    const submitIcon = document.getElementById('btn-submit-icon');
    const diffTag = document.getElementById('diff-tag');

    if (type === 'IN') {
      btnIn.className = "flex items-center justify-center gap-2 py-3 px-space-sm rounded-lg font-label-action text-label-action transition-all bg-surface-container-lowest text-primary shadow-sm active:scale-98";
      btnOut.className = "flex items-center justify-center gap-2 py-3 px-space-sm rounded-lg font-label-action text-label-action transition-all text-on-surface-variant active:scale-98";
      
      badgeLabel.className = "font-label-receipt text-label-receipt uppercase px-2 py-0.5 rounded-full bg-primary-fixed text-on-primary-fixed";
      badgeLabel.textContent = "Aporte de Efectivo";
      
      displaySign.textContent = "+";
      displaySign.className = "font-headline-lg text-headline-lg text-primary";
      
      diffTag.className = "text-primary font-label-numeric-sm text-label-numeric-sm";

      submitBtn.className = "w-full h-14 rounded-xl bg-primary hover:opacity-95 active:scale-[0.98] text-on-primary font-label-action text-label-action uppercase tracking-wider flex items-center justify-between px-space-lg shadow-md transition-all";
      submitText.textContent = "Confirmar Entrada";
      submitIcon.textContent = "input";
    } else {
      btnOut.className = "flex items-center justify-center gap-2 py-3 px-space-sm rounded-lg font-label-action text-label-action transition-all bg-surface-container-lowest text-secondary shadow-sm active:scale-98";
      btnIn.className = "flex items-center justify-center gap-2 py-3 px-space-sm rounded-lg font-label-action text-label-action transition-all text-on-surface-variant active:scale-98";

      badgeLabel.className = "font-label-receipt text-label-receipt uppercase px-2 py-0.5 rounded-full bg-secondary-fixed text-on-secondary-fixed";
      badgeLabel.textContent = "Gasto o Retirada";

      displaySign.textContent = "-";
      displaySign.className = "font-headline-lg text-headline-lg text-secondary";

      diffTag.className = "text-secondary font-label-numeric-sm text-label-numeric-sm";

      submitBtn.className = "w-full h-14 rounded-xl bg-secondary hover:opacity-95 active:scale-[0.98] text-on-secondary font-label-action text-label-action uppercase tracking-wider flex items-center justify-between px-space-lg shadow-md transition-all";
      submitText.textContent = "Confirmar Salida";
      submitIcon.textContent = "output";
    }
    updateDisplay();
  }

  function selectReason(buttonEl, text) {
    document.querySelectorAll('.reason-chip').forEach(btn => {
      btn.className = "reason-chip px-3 py-1.5 rounded-full bg-surface-container-lowest text-on-surface font-body-sm text-body-sm font-medium flex items-center gap-1 shadow-sm active:scale-95 transition-all";
    });
    
    const activeColorClass = movementMode === 'IN' ? 'bg-primary text-on-primary' : 'bg-secondary text-on-secondary';
    buttonEl.className = `reason-chip px-3 py-1.5 rounded-full ${activeColorClass} font-body-sm text-body-sm font-medium flex items-center gap-1 shadow-sm active:scale-95 transition-all`;
    
    if (text) {
      document.getElementById('note-input').value = text;
    } else {
      document.getElementById('note-input').value = '';
      document.getElementById('note-input').focus();
    }
  }

  function confirmMovement() {
    const finalAmount = (currentRawCents / 100).toFixed(2);
    const actionWord = movementMode === 'IN' ? 'Entrada registrada' : 'Salida registrada';
    const note = document.getElementById('note-input').value;
    
    const submitBtn = document.getElementById('btn-submit');
    submitBtn.innerHTML = `
      <span class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[24px] animate-spin">sync</span>
        <span>Guardando en Cajón...</span>
      </span>
      <span>${movementMode === 'IN' ? '+' : '-'}${finalAmount} €</span>
    `;

    setTimeout(() => {
      submitBtn.innerHTML = `
        <span class="flex items-center gap-2">
          <span class="material-symbols-outlined text-[24px]">check_circle</span>
          <span>¡${actionWord}!</span>
        </span>
        <span>Imprimiendo...</span>
      `;
      submitBtn.className = "w-full h-14 rounded-xl bg-primary text-on-primary font-label-action text-label-action uppercase tracking-wider flex items-center justify-between px-space-lg shadow-md transition-all";
      
      setTimeout(() => {
        if (window.history.length > 1) {
          window.history.back();
        }
      }, 700);
    }, 500);
  }

  // Inicializar estado
  updateDisplay();
</script></main></body></html>

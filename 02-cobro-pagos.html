<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cobro de Ticket - La Piruleta</title>
  <link rel="manifest" href="./manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Epilogue', sans-serif; }</style>
</head>
<body class="bg-[#fff8f5] text-stone-800 pb-20">
  <header class="bg-white border-b border-stone-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <a href="index.html" class="p-2 rounded-xl bg-stone-100 text-stone-700"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
    <h1 class="font-bold text-sm">Cobro Ticket #0142 • Mesa 4</h1>
    <a href="06-movimiento-caja.html" class="text-xs font-bold text-[#1b7a4a]">Caja 1</a>
  </header>

  <main class="p-4 max-w-lg mx-auto space-y-4">
    <div class="bg-white p-5 rounded-2xl border border-stone-200 text-center shadow-sm">
      <span class="text-xs text-stone-500 font-semibold uppercase tracking-wider">Total a Cobrar</span>
      <div class="text-4xl font-extrabold text-stone-900 my-1">6,50 €</div>
      <span class="text-xs text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full font-medium">IVA 10% incluido (0,59 €)</span>
    </div>

    <div class="grid grid-cols-4 gap-2">
      <button class="bg-[#1b7a4a] text-white p-3 rounded-xl flex flex-col items-center gap-1 shadow">
        <i data-lucide="banknote" class="w-5 h-5"></i>
        <span class="text-xs font-bold">Efectivo</span>
      </button>
      <button class="bg-white border border-stone-200 p-3 rounded-xl flex flex-col items-center gap-1 text-stone-700">
        <i data-lucide="credit-card" class="w-5 h-5"></i>
        <span class="text-xs font-medium">Datáfono</span>
      </button>
      <button class="bg-white border border-stone-200 p-3 rounded-xl flex flex-col items-center gap-1 text-stone-700">
        <i data-lucide="qr-code" class="w-5 h-5"></i>
        <span class="text-xs font-medium">Bizum</span>
      </button>
      <a href="09-clientes-fidelizacion.html" class="bg-white border border-stone-200 p-3 rounded-xl flex flex-col items-center gap-1 text-stone-700">
        <i data-lucide="gift" class="w-5 h-5"></i>
        <span class="text-xs font-medium">PiruClub</span>
      </a>
    </div>

    <div class="bg-white p-4 rounded-2xl border border-stone-200 space-y-3 shadow-sm">
      <div class="text-xs font-bold text-stone-500 uppercase">Billetes Rápidos</div>
      <div class="grid grid-cols-4 gap-2">
        <button class="py-2.5 rounded-lg bg-stone-100 font-bold text-stone-800 text-sm">Exacto</button>
        <button class="py-2.5 rounded-lg bg-emerald-50 text-[#1b7a4a] font-bold text-sm border border-emerald-200">10 €</button>
        <button class="py-2.5 rounded-lg bg-stone-100 font-bold text-stone-800 text-sm">20 €</button>
        <button class="py-2.5 rounded-lg bg-stone-100 font-bold text-stone-800 text-sm">50 €</button>
      </div>
      <div class="p-3 bg-emerald-50 border border-emerald-100 rounded-xl flex justify-between items-center">
        <span class="text-xs font-bold text-stone-700">Cambio a devolver:</span>
        <span class="text-xl font-extrabold text-[#1b7a4a]">3,50 €</span>
      </div>
    </div>

    <div class="bg-white p-3.5 rounded-2xl border border-stone-200 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="printer" class="w-5 h-5 text-stone-500"></i>
        <span class="text-xs font-semibold text-stone-800">Imprimir ticket y abrir cajón</span>
      </div>
      <input type="checkbox" checked class="w-5 h-5 text-[#1b7a4a] rounded accent-[#1b7a4a]">
    </div>

    <a href="index.html" class="block w-full py-3.5 bg-[#1b7a4a] hover:bg-[#15613b] text-white text-center font-bold text-sm rounded-xl shadow">
      ✓ CONFIRMAR COBRO (6,50 €)
    </a>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Piruleta TPV</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1b7a4a">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
body{font-family:Epilogue,system-ui,sans-serif;background:#fff8f5;color:#292524}
.chip{padding:.45rem .9rem;border-radius:.8rem;font-weight:700;font-size:.8rem;background:#fff;border:1px solid #e7e5e4;white-space:nowrap}
.chip.on{background:#1b7a4a;color:#fff;border-color:#1b7a4a}
.btn{padding:.7rem 1rem;border-radius:.9rem;font-weight:800;font-size:.85rem}
.inp{width:100%;margin-top:.25rem;padding:.6rem;border:1px solid #d6d3d1;border-radius:.7rem;font-size:.95rem}
.mono{font-family:'Space Mono',monospace}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block!important}}
</style></head>
<body class="h-screen flex flex-col" style="padding-top:env(safe-area-inset-top,0px)">
<header class="bg-[#1b7a4a] text-white flex items-center gap-1 px-2 py-2 overflow-x-auto" id="nav"></header>
<main class="flex-1 overflow-auto" id="app"></main>
<div id="m"></div><div id="print"></div>
<script>
const K='lapiruleta_estado',$=s=>document.querySelector(s);
const rd=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(+n||0).toFixed(2).replace('.',',')+' €',num=s=>parseFloat(String(s).replace(',','.'))||0;
const V={v:'venta',cat:-1,edit:false},DEF_AJ={nombre:'La Piruleta',cif:'',dir:'',pie:'¡Gracias por su visita!',serie:'T-',ancho:'80'};

/* ===== ESTADO CENTRAL (única fuente de verdad) ===== */
let S=rd(K,null);
if(!S){ // migración desde la versión de varios archivos
  const ct=rd('lapiruleta_categorias',[]).map(c=>typeof c=='object'?{id:c.id,n:c.nombre||c.name}:{id:c,n:c});
  S={categorias:ct.map(c=>c.n),
    productos:rd('lapiruleta_productos',[]).map(p=>{const c=p.categoria??p.cat??p.categoriaId;const f=ct.find(x=>x.id==c);
      return{id:p.id||uid(),nombre:p.nombre||p.name||'Artículo',precio:num(p.precio??p.price),iva:num(p.iva)||10,cat:f?f.n:(c||'')}}),
    ajustes:{...DEF_AJ,...rd('lapiruleta_ajustes_generales',{})},
    mesas:[1,2,3,4,5,6].map(i=>({id:uid(),nombre:'Mesa '+i,x:8+((i-1)%3)*30,y:10+Math.floor((i-1)/3)*40,forma:i%2?'cuadrada':'redonda'})),
    pendientes:[],ventas:rd('lapiruleta_ventas_caja',[]),movimientos:[],turnos:rd('lapiruleta_historico_turnos',[]),fondo:150,n:100,activo:null};
}
S.ajustes={...DEF_AJ,...S.ajustes};
function nuevo(mesa='BARRA'){const p=S.ajustes.serie.endsWith('-')?S.ajustes.serie:S.ajustes.serie+'-';return{id:null,numero:'#'+p+(S.n++),mesa,lineas:[]}}
if(!S.activo)S.activo=nuevo();
function save(r=true){localStorage.setItem(K,JSON.stringify(S));if(r)render()}
const tot=t=>t.lineas.reduce((s,l)=>s+l.precio*l.qty,0);

/* ===== ACCIONES (cada botón llama a una de estas) ===== */
const A={
 go(v){location.hash=v},
 cat(i){V.cat=i;render()},
 add(i){const p=S.productos[i],l=S.activo.lineas.find(x=>x.pid==p.id);l?l.qty++:S.activo.lineas.push({pid:p.id,nombre:p.nombre,precio:p.precio,iva:p.iva,qty:1});save()},
 q(i,d){const l=S.activo.lineas[i];l.qty+=d;if(l.qty<=0)S.activo.lineas.splice(i,1);save()},
 vaciar(){if(S.activo.lineas.length&&!confirm('¿Vaciar la cesta?'))return;S.activo.lineas=[];save()},
 aparcar(){const a=S.activo;if(!a.lineas.length)return alert('La cesta está vacía');a.id=a.id||uid();S.pendientes=S.pendientes.filter(t=>t.id!==a.id);S.pendientes.push(a);S.activo=nuevo();save()},
 recuperar(id){if(S.activo.lineas.length)A.aparcar();const t=S.pendientes.find(x=>x.id==id);S.pendientes=S.pendientes.filter(x=>x.id!=id);S.activo=t;save(false);A.go('venta')},
 borrarTicket(id){if(!confirm('¿Eliminar este ticket pendiente?'))return;S.pendientes=S.pendientes.filter(t=>t.id!=id);save()},
 pay(m){const a=S.activo,T=tot(a);if(!a.lineas.length)return;
  modal('Cobrar '+m+' · '+money(T),m=='Efectivo'?[{k:'e',l:'Entregado (€)',v:T.toFixed(2).replace('.',','),n:1}]:[],v=>{
   const ent=m=='Efectivo'?num(v.e):T;if(ent<T-.001){alert('El importe entregado es menor que el total');return false}
   const venta={id:uid(),numero:a.numero,mesa:a.mesa,total:T,metodo:m,lineas:a.lineas,ts:Date.now(),entregado:ent,cambio:ent-T,reemb:false};
   S.ventas.push(venta);S.activo=nuevo();save();A.ver(S.ventas.length-1,true)})},
 ver(i,nuevoCobro){const v=S.ventas[i];$('#print').innerHTML=tkt(v);
  $('#m').innerHTML=ov(`<h3 class="font-extrabold mb-2">${nuevoCobro?'✅ Cobro completado':'Ticket '+esc(v.numero)}${v.reemb?' · REEMBOLSADO':''}</h3>${v.cambio>0.004?`<p class="mb-2 font-bold text-[#1b7a4a]">Cambio: ${money(v.cambio)}</p>`:''}<div class="overflow-auto max-h-[50vh] border rounded-xl p-2 mb-3">${tkt(v)}</div><div class="flex gap-2"><button class="btn bg-stone-200 flex-1" onclick="X()">Cerrar</button>${!v.reemb&&!nuevoCobro?`<button class="btn bg-red-100 text-red-700 flex-1" onclick="A.reemb(${i})">Reembolsar</button>`:''}<button class="btn bg-[#1b7a4a] text-white flex-1" onclick="window.print()">Imprimir</button></div>`)},
 reemb(i){if(!confirm('¿Reembolsar el ticket completo? Se descontará del cierre de caja.'))return;S.ventas[i].reemb=true;X();save()},
 mesa(i){if(V.edit)return;const m=S.mesas[i],t=S.pendientes.find(x=>x.mesa==m.nombre);
  if(t)return A.recuperar(t.id);S.activo.mesa=m.nombre;save(false);A.go('venta')},
 editar(){V.edit=!V.edit;render()},
 addMesa(){S.mesas.push({id:uid(),nombre:'Mesa '+(S.mesas.length+1),x:5,y:5,forma:'cuadrada'});save()},
 drag(e,i){if(!V.edit)return;const el=e.currentTarget,c=$('#plano').getBoundingClientRect(),m=S.mesas[i];let mv=false;el.setPointerCapture(e.pointerId);
  el.onpointermove=ev=>{mv=true;m.x=Math.max(0,Math.min(88,(ev.clientX-c.left)/c.width*100-6));m.y=Math.max(0,Math.min(85,(ev.clientY-c.top)/c.height*100-6));el.style.left=m.x+'%';el.style.top=m.y+'%'};
  el.onpointerup=()=>{el.onpointermove=null;mv?save(false):A.mesaForm(i)}},
 mesaForm(i){const m=S.mesas[i];modal('Mesa',[{k:'n',l:'Nombre',v:m.nombre},{k:'f',l:'Forma',v:m.forma,o:['cuadrada','redonda']}],v=>{
   S.pendientes.forEach(t=>{if(t.mesa==m.nombre)t.mesa=v.n});if(S.activo.mesa==m.nombre)S.activo.mesa=v.n;m.nombre=v.n||m.nombre;m.forma=v.f;save()},
   `<button class="btn bg-red-100 text-red-700 w-full" onclick="A.delMesa(${i})">Eliminar mesa</button>`)},
 delMesa(i){S.mesas.splice(i,1);X();save()},
 mov(){modal('Movimiento de caja',[{k:'t',l:'Tipo',v:'salida',o:['entrada','salida']},{k:'i',l:'Importe (€)',v:'',n:1},{k:'r',l:'Motivo',v:''}],v=>{
   if(num(v.i)<=0)return alert('Introduce un importe'),false;S.movimientos.push({tipo:v.t,importe:num(v.i),motivo:v.r,ts:Date.now()});save()})},
 fondo(){modal('Fondo de caja inicial',[{k:'f',l:'Importe (€)',v:String(S.fondo),n:1}],v=>{S.fondo=num(v.f);save()})},
 cerrar(){const c=calc();if(!confirm('¿Cerrar el turno? Se archivarán '+c.vs.length+' ventas y la caja volverá a cero.'))return;
  S.turnos.push({fecha:new Date().toISOString(),ventas:S.ventas,movimientos:S.movimientos,fondo:S.fondo,esperado:c.esp});S.ventas=[];S.movimientos=[];save()},
 cat_(){modal('Nueva categoría',[{k:'n',l:'Nombre',v:''}],v=>{if(v.n.trim())S.categorias.push(v.n.trim());save()})},
 delCat(i){const n=S.categorias[i];if(!confirm('¿Eliminar la categoría '+n+'? Sus artículos quedarán sin categoría.'))return;S.productos.forEach(p=>{if(p.cat==n)p.cat=''});S.categorias.splice(i,1);V.cat=-1;save()},
 prod(i){const p=i<0?{nombre:'',precio:'',iva:10,cat:S.categorias[0]||''}:S.productos[i];
  modal(i<0?'Nuevo artículo':'Editar artículo',[{k:'n',l:'Nombre',v:p.nombre},{k:'p',l:'Precio (€)',v:String(p.precio).replace('.',','),n:1},{k:'i',l:'IVA %',v:String(p.iva),o:['4','10','21']},{k:'c',l:'Categoría',v:p.cat,o:['',...S.categorias]}],v=>{
   if(!v.n.trim())return alert('Falta el nombre'),false;const d={nombre:v.n.trim(),precio:num(v.p),iva:num(v.i),cat:v.c};
   i<0?S.productos.push({id:uid(),...d}):Object.assign(S.productos[i],d);save()},
   i<0?'':`<button class="btn bg-red-100 text-red-700 w-full" onclick="A.delProd(${i})">Eliminar artículo</button>`)},
 delProd(i){S.productos.splice(i,1);X();save()},
 negocio(){const a=S.ajustes;modal('Datos del negocio',[{k:'nombre',l:'Razón social',v:a.nombre},{k:'cif',l:'CIF/NIF',v:a.cif},{k:'dir',l:'Dirección',v:a.dir},{k:'pie',l:'Pie del ticket',v:a.pie},{k:'serie',l:'Serie',v:a.serie},{k:'ancho',l:'Papel (mm)',v:a.ancho,o:['80','58']}],v=>{S.ajustes={...a,...v};save()})},
 export(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='piruleta-copia-'+new Date().toISOString().slice(0,10)+'.json';l.click()},
 reset(){if(confirm('¿Borrar TODOS los datos del TPV? Esta acción no se puede deshacer.')){localStorage.removeItem(K);location.reload()}}
};

/* ===== UTILIDADES UI ===== */
const X=()=>$('#m').innerHTML='';
const ov=h=>`<div class="fixed inset-0 bg-black/50 grid place-items-center p-4 z-50"><div class="bg-white rounded-2xl p-5 w-full max-w-sm max-h-[92vh] overflow-auto">${h}</div></div>`;
function modal(t,fs,ok,extra=''){
 $('#m').innerHTML=ov(`<h3 class="font-extrabold mb-3">${t}</h3>${fs.map(f=>`<label class="block text-xs font-bold mb-2">${f.l}${f.o?`<select id="f_${f.k}" class="inp">${f.o.map(o=>`<option ${o==f.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="f_${f.k}" class="inp" value="${esc(f.v)}" ${f.n?'inputmode="decimal"':''}>`}</label>`).join('')}${extra}<div class="flex gap-2 mt-3"><button class="btn bg-stone-200 flex-1" onclick="X()">Cancelar</button><button class="btn bg-[#1b7a4a] text-white flex-1" id="mok">Aceptar</button></div>`);
 $('#mok').onclick=()=>{const v={};fs.forEach(f=>v[f.k]=$('#f_'+f.k).value);if(ok(v)!==false)X()};
 const f=$('#m input');f&&f.select()}
function tkt(v){const a=S.ajustes,d=new Date(v.ts).toLocaleString('es-ES');
 return `<div class="mono text-[11px] leading-snug mx-auto" style="width:${a.ancho=='58'?'54':'76'}mm;color:#000"><div class="text-center font-bold">${esc(a.nombre)}</div><div class="text-center">${esc(a.cif)}<br>${esc(a.dir)}</div><hr class="my-1 border-dashed border-black">${esc(v.numero)} · ${esc(v.mesa)}<br>${d}<hr class="my-1 border-dashed border-black">${(v.lineas||[]).map(l=>`<div class="flex justify-between"><span>${l.qty}x ${esc(l.nombre)}</span><span>${money(l.qty*l.precio)}</span></div>`).join('')}<hr class="my-1 border-dashed border-black"><div class="flex justify-between font-bold"><span>TOTAL</span><span>${money(v.total)}</span></div>${esc(v.metodo)}${v.cambio>0.004?` · Cambio ${money(v.cambio)}`:''}${v.reemb?'<br><b>*** REEMBOLSADO ***</b>':''}<div class="text-center mt-2">${esc(a.pie)}</div></div>`}
function calc(){const vs=S.ventas.filter(v=>!v.reemb),by=m=>vs.filter(v=>v.metodo==m).reduce((s,v)=>s+v.total,0),
 mv=S.movimientos.reduce((s,m)=>s+(m.tipo=='entrada'?m.importe:-m.importe),0),ef=by('Efectivo');
 return{vs,ef,ta:by('Tarjeta'),bi:by('Bizum'),mv,tot:vs.reduce((s,v)=>s+v.total,0),esp:S.fondo+ef+mv}}

/* ===== VISTAS ===== */
const VIEWS={
venta(){const a=S.activo,ps=S.productos.filter(p=>V.cat<0||p.cat==S.categorias[V.cat]),T=tot(a);
 return `<div class="grid md:grid-cols-[1fr_340px] h-full"><section class="p-3 overflow-auto">
 <div class="flex gap-2 mb-3 overflow-x-auto"><button class="chip ${V.cat<0?'on':''}" onclick="A.cat(-1)">Todos</button>${S.categorias.map((c,i)=>`<button class="chip ${V.cat==i?'on':''}" onclick="A.cat(${i})">${esc(c)}</button>`).join('')}</div>
 ${ps.length?`<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2">${ps.map(p=>`<button onclick="A.add(${S.productos.indexOf(p)})" class="bg-white border border-stone-200 rounded-2xl p-3 text-left active:scale-95 transition h-24 flex flex-col justify-between"><span class="font-bold text-sm leading-tight">${esc(p.nombre)}</span><span class="mono text-[#1b7a4a]">${money(p.precio)}</span></button>`).join('')}</div>`:`<div class="text-center text-stone-500 mt-16"><p class="mb-3">Aún no hay artículos.</p><button class="btn bg-[#1b7a4a] text-white" onclick="A.go('catalogo')">Crear artículos</button></div>`}</section>
 <aside class="bg-white border-l border-stone-200 flex flex-col min-h-[50vh]"><div class="p-3 border-b flex justify-between items-center"><div><div class="font-extrabold">${esc(a.numero)}</div><button class="text-xs font-bold text-amber-600" onclick="A.go('mesas')">📍 ${esc(a.mesa)}</button></div><button class="text-xs font-bold text-red-600" onclick="A.vaciar()">Vaciar</button></div>
 <div class="flex-1 overflow-auto p-2">${a.lineas.length?a.lineas.map((l,i)=>`<div class="flex items-center gap-2 py-2 border-b border-stone-100"><div class="flex-1 text-sm font-semibold">${esc(l.nombre)}<div class="text-xs text-stone-500">${money(l.precio)}</div></div><button class="w-8 h-8 rounded-lg bg-stone-100 font-bold" onclick="A.q(${i},-1)">−</button><b class="w-5 text-center">${l.qty}</b><button class="w-8 h-8 rounded-lg bg-stone-100 font-bold" onclick="A.q(${i},1)">+</button><span class="mono text-sm w-16 text-right">${money(l.qty*l.precio)}</span></div>`).join(''):'<p class="text-center text-stone-400 mt-10 text-sm">Toca un artículo para añadirlo</p>'}</div>
 <div class="p-3 border-t"><div class="flex justify-between text-lg font-extrabold mb-2"><span>Total</span><span class="mono">${money(T)}</span></div>
 <div class="grid grid-cols-3 gap-2 mb-2">${['Efectivo','Tarjeta','Bizum'].map(m=>`<button class="btn bg-[#1b7a4a] text-white disabled:opacity-40" ${a.lineas.length?'':'disabled'} onclick="A.pay('${m}')">${m}</button>`).join('')}</div>
 <button class="btn bg-amber-100 text-amber-800 w-full" onclick="A.aparcar()">Aparcar ticket</button></div></aside></div>`},
tickets(){return `<div class="p-4 max-w-2xl mx-auto"><h2 class="font-extrabold text-xl mb-3">Tickets pendientes</h2>${S.pendientes.length?S.pendientes.map(t=>`<div class="bg-white rounded-2xl border p-3 mb-2 flex items-center gap-3"><div class="flex-1"><div class="font-extrabold">${esc(t.numero)} · <span class="text-amber-600">${esc(t.mesa)}</span></div><div class="text-xs text-stone-500">${t.lineas.reduce((s,l)=>s+l.qty,0)} artículos</div></div><b class="mono">${money(tot(t))}</b><button class="btn bg-[#1b7a4a] text-white" onclick="A.recuperar('${t.id}')">Abrir</button><button class="text-red-500 font-bold px-2" onclick="A.borrarTicket('${t.id}')">✕</button></div>`).join(''):'<p class="text-stone-500">No hay tickets pendientes.</p>'}</div>`},
mesas(){return `<div class="p-3 h-full flex flex-col"><div class="flex gap-2 mb-2 items-center"><h2 class="font-extrabold text-xl flex-1">Plano de mesas</h2>${V.edit?'<button class="btn bg-stone-200" onclick="A.addMesa()">+ Mesa</button>':''}<button class="btn ${V.edit?'bg-amber-500 text-white':'bg-stone-200'}" onclick="A.editar()">${V.edit?'Listo':'Editar plano'}</button></div>
 <div id="plano" class="relative flex-1 min-h-[60vh] bg-white border-2 border-dashed border-stone-300 rounded-2xl overflow-hidden">${S.mesas.map((m,i)=>{const oc=S.pendientes.some(t=>t.mesa==m.nombre)||(S.activo.mesa==m.nombre&&S.activo.lineas.length);
 return `<button onclick="A.mesa(${i})" onpointerdown="A.drag(event,${i})" class="absolute w-20 h-20 ${m.forma=='redonda'?'rounded-full':'rounded-2xl'} font-extrabold text-sm border-2 ${oc?'bg-amber-100 border-amber-500 text-amber-800':'bg-emerald-50 border-[#1b7a4a] text-[#1b7a4a]'}" style="left:${m.x}%;top:${m.y}%;${V.edit?'touch-action:none;outline:2px dashed #78716c':''}">${esc(m.nombre)}<div class="text-[10px] font-semibold">${oc?'ocupada':'libre'}</div></button>`}).join('')}</div></div>`},
caja(){const c=calc();return `<div class="p-4 max-w-xl mx-auto"><h2 class="font-extrabold text-xl mb-3">Caja y cierre de turno</h2>
 <div class="bg-white border rounded-2xl p-4 mb-3"><div class="flex justify-between"><span>Facturado (${c.vs.length} tickets)</span><b class="mono">${money(c.tot)}</b></div>
 ${[['Efectivo',c.ef],['Tarjeta',c.ta],['Bizum',c.bi]].map(([n,v])=>`<div class="flex justify-between text-sm text-stone-600"><span>· ${n}</span><span class="mono">${money(v)}</span></div>`).join('')}
 <hr class="my-2"><div class="flex justify-between text-sm"><span>Fondo inicial <button class="underline text-[#1b7a4a]" onclick="A.fondo()">cambiar</button></span><span class="mono">${money(S.fondo)}</span></div>
 <div class="flex justify-between text-sm"><span>Entradas/salidas</span><span class="mono">${money(c.mv)}</span></div>
 <div class="flex justify-between font-extrabold text-lg mt-1"><span>Efectivo esperado</span><span class="mono">${money(c.esp)}</span></div></div>
 <div class="flex gap-2 mb-3"><button class="btn bg-stone-200 flex-1" onclick="A.mov()">+ Entrada / salida</button><button class="btn bg-stone-200 flex-1" onclick="window.print()">Informe Z</button></div>
 ${S.movimientos.map(m=>`<div class="flex justify-between text-sm py-1 border-b"><span>${m.tipo=='entrada'?'⬆':'⬇'} ${esc(m.motivo||m.tipo)}</span><b class="mono ${m.tipo=='entrada'?'text-green-700':'text-red-600'}">${m.tipo=='entrada'?'+':'−'}${money(m.importe)}</b></div>`).join('')}
 <button class="btn bg-[#1b7a4a] text-white w-full mt-4" onclick="A.cerrar()">Finalizar y cerrar turno (${money(c.esp)})</button><p class="text-xs text-stone-500 mt-2 text-center">${S.turnos.length} turnos archivados</p></div>`},
historial(){const l=S.ventas.map((v,i)=>[v,i]).reverse();return `<div class="p-4 max-w-2xl mx-auto"><h2 class="font-extrabold text-xl mb-3">Ventas del turno</h2>${l.length?l.map(([v,i])=>`<button onclick="A.ver(${i})" class="w-full bg-white border rounded-2xl p-3 mb-2 flex items-center gap-3 text-left ${v.reemb?'opacity-50':''}"><div class="flex-1"><b>${esc(v.numero)}</b> · ${esc(v.mesa)}<div class="text-xs text-stone-500">${new Date(v.ts).toLocaleTimeString('es-ES')} · ${esc(v.metodo)}${v.reemb?' · reembolsado':''}</div></div><b class="mono">${money(v.total)}</b></button>`).join(''):'<p class="text-stone-500">Aún no hay ventas en este turno.</p>'}</div>`},
catalogo(){return `<div class="p-4 max-w-2xl mx-auto"><div class="flex items-center mb-3"><h2 class="font-extrabold text-xl flex-1">Catálogo</h2><button class="btn bg-stone-200 mr-2" onclick="A.cat_()">+ Categoría</button><button class="btn bg-[#1b7a4a] text-white" onclick="A.prod(-1)">+ Artículo</button></div>
 <div class="flex flex-wrap gap-2 mb-3">${S.categorias.map((c,i)=>`<span class="chip">${esc(c)} <button class="text-red-500 ml-1" onclick="A.delCat(${i})">✕</button></span>`).join('')||'<span class="text-sm text-stone-500">Sin categorías</span>'}</div>
 ${S.productos.map((p,i)=>`<button onclick="A.prod(${i})" class="w-full bg-white border rounded-2xl p-3 mb-2 flex items-center gap-3 text-left"><div class="flex-1 font-bold">${esc(p.nombre)}<div class="text-xs text-stone-500">${esc(p.cat||'Sin categoría')} · IVA ${p.iva}%</div></div><b class="mono">${money(p.precio)}</b></button>`).join('')}</div>`},
ajustes(){const a=S.ajustes;return `<div class="p-4 max-w-xl mx-auto"><h2 class="font-extrabold text-xl mb-3">Ajustes</h2><div class="bg-white border rounded-2xl p-4 mb-3 text-sm"><b>${esc(a.nombre)}</b><br>CIF: ${esc(a.cif)||'—'}<br>${esc(a.dir)||'Sin dirección'}<br>Serie ${esc(a.serie)} · papel ${a.ancho} mm</div>
 <button class="btn bg-[#1b7a4a] text-white w-full mb-2" onclick="A.negocio()">Editar datos del negocio y ticket</button><button class="btn bg-stone-200 w-full mb-2" onclick="A.export()">Exportar copia de seguridad</button><button class="btn bg-red-100 text-red-700 w-full" onclick="A.reset()">Borrar todos los datos</button></div>`}
};
const TABS=[['venta','Venta'],['tickets','Tickets'],['mesas','Mesas'],['caja','Caja'],['historial','Historial'],['catalogo','Catálogo'],['ajustes','Ajustes']];
function render(){V.v=VIEWS[location.hash.slice(1)]?location.hash.slice(1):'venta';
 $('#nav').innerHTML=TABS.map(([k,n])=>`<button onclick="A.go('${k}')" class="px-3 py-2 rounded-xl text-sm font-bold whitespace-nowrap ${V.v==k?'bg-white text-[#1b7a4a]':'bg-emerald-900/40'}">${n}${k=='tickets'&&S.pendientes.length?` <span class="bg-amber-500 text-white rounded-full px-1.5 text-xs">${S.pendientes.length}</span>`:''}</button>`).join('');
 $('#app').innerHTML=VIEWS[V.v]()}
addEventListener('hashchange',render);addEventListener('storage',e=>{if(e.key==K){S=JSON.parse(e.newValue);render()}});
save();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>

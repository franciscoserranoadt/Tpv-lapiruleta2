<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>La Piruleta TPV - Ventas</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Epilogue', sans-serif; -webkit-tap-highlight-color: transparent; }</style>
</head>
<body class="bg-[#fff8f5] text-stone-800 antialiased select-none pb-24">
  
  <!-- CABECERA -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-stone-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <a href="03-tickets-mesas.html" class="p-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </a>
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="font-bold text-xs text-stone-900">Caja 1 • Turno Abierto</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="13-config-impresoras.html" class="p-2 rounded-xl bg-stone-100 text-stone-700">
        <i data-lucide="printer" class="w-5 h-5"></i>
      </a>
      <div class="w-8 h-8 rounded-full bg-[#1b7a4a] text-white flex items-center justify-center font-bold text-xs">LP</div>
    </div>
  </header>

  <main class="p-4 max-w-lg mx-auto space-y-4">
    <!-- BARRA BÚSQUEDA Y CATEGORÍAS -->
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-stone-400"></i>
      <input type="text" placeholder="Buscar producto o código..." class="w-full pl-9 pr-4 py-2.5 bg-white border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#1b7a4a]">
    </div>

    <!-- Píldoras de Categorías -->
    <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-none items-center">
      <button class="px-3.5 py-1.5 rounded-lg bg-stone-900 text-white text-xs font-bold whitespace-nowrap">Todos (0)</button>
      <a href="10-catalogo-stock.html" class="px-3.5 py-1.5 rounded-lg bg-white border border-dashed border-stone-300 text-stone-500 hover:text-stone-800 text-xs font-semibold whitespace-nowrap flex items-center gap-1">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i> Añadir categorías
      </a>
    </div>

    <!-- ESTADO VACÍO (SIN PRODUCTOS FICTICIOS) -->
    <div class="bg-white border-2 border-dashed border-stone-200 rounded-3xl p-8 text-center space-y-4 shadow-sm my-6">
      <div class="w-16 h-16 mx-auto bg-stone-50 border border-stone-200 rounded-2xl flex items-center justify-center text-stone-400">
        <i data-lucide="shopping-bag" class="w-8 h-8 text-stone-400"></i>
      </div>
      <div class="space-y-1">
        <h3 class="font-bold text-base text-stone-900">Catálogo limpio y listo</h3>
        <p class="text-xs text-stone-500 max-w-xs mx-auto leading-relaxed">
          No hay artículos de ejemplo cargados. Añade tus propios productos reales para empezar a registrar ventas en caja.
        </p>
      </div>
      <a href="10-catalogo-stock.html" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-[#1b7a4a] hover:bg-[#15613b] text-white text-xs font-bold rounded-xl shadow transition-colors">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        <span>Crear mis productos en Catálogo</span>
      </a>
    </div>
  </main>

  <!-- BARRA DE COBRO TICKET FLOTANTE INFERIOR (ESTADO TICKET VACÍO) -->
  <div class="fixed bottom-14 left-0 right-0 p-3 bg-white/95 backdrop-blur border-t border-stone-200 shadow-md">
    <div class="max-w-lg mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 bg-stone-50 border border-stone-200 px-3.5 py-2.5 rounded-xl text-stone-400 font-bold text-xs">
        <i data-lucide="receipt" class="w-4 h-4"></i>
        <span>Ticket vacío • 0 arts.</span>
      </div>
      <button disabled class="flex-1 bg-stone-200 text-stone-400 py-2.5 px-4 rounded-xl flex items-center justify-between font-bold text-sm cursor-not-allowed">
        <span>COBRAR</span>
        <span class="bg-stone-300/50 px-2 py-0.5 rounded-lg text-sm">0,00 €</span>
      </button>
    </div>
  </div>

  <!-- NAVEGACIÓN INFERIOR (TABS) -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-stone-200 px-3 py-2 flex items-center justify-around">
    <a href="index.html" class="flex flex-col items-center gap-0.5 text-[#1b7a4a]">
      <i data-lucide="calculator" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold">Ventas</span>
    </a>
    <a href="03-tickets-mesas.html" class="flex flex-col items-center gap-0.5 text-stone-400 hover:text-stone-700">
      <i data-lucide="receipt" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Tickets</span>
    </a>
    <a href="04-plano-mesas.html" class="flex flex-col items-center gap-0.5 text-stone-400 hover:text-stone-700">
      <i data-lucide="layout-grid" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Mesas</span>
    </a>
    <a href="10-catalogo-stock.html" class="flex flex-col items-center gap-0.5 text-stone-400 hover:text-stone-700">
      <i data-lucide="package" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Catálogo</span>
    </a>
    <a href="05-cierre-caja.html" class="flex flex-col items-center gap-0.5 text-stone-400 hover:text-stone-700">
      <i data-lucide="banknote" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Caja</span>
    </a>
  </nav>

  <script>
    lucide.createIcons();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catálogo e Inventario - La Piruleta TPV</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { font-family: 'Epilogue', sans-serif; -webkit-tap-highlight-color: transparent; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#fff8f5] text-stone-800 antialiased select-none h-screen max-h-screen flex flex-col overflow-hidden">

  <!-- CABECERA SUPERIOR PROFESIONAL TPV COMPACTA -->
  <header class="bg-[#1b7a4a] text-white px-4 py-2 flex items-center justify-between shadow-sm shrink-0">
    <div class="flex items-center gap-3">
      <a href="index.html" class="p-1.5 rounded-xl bg-emerald-900/40 hover:bg-emerald-900/70 text-emerald-100 transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
      </a>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-bold text-sm tracking-tight leading-none">Catálogo e Inventario</h1>
          <span class="text-[9px] bg-emerald-900/60 text-emerald-200 px-1.5 py-0.5 rounded-full font-medium">Gestión de productos y stock</span>
        </div>
        <p class="text-[11px] text-emerald-100 mt-0.5">Control de artículos y precios</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" onclick="abrirModalNuevoArticulo()" class="px-3 py-1.5 rounded-xl bg-white text-[#1b7a4a] hover:bg-emerald-50 font-bold text-xs flex items-center gap-1.5 shadow-sm transition-colors">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Nuevo Artículo</span>
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 p-3 max-w-[1700px] w-full mx-auto flex flex-col space-y-3 min-h-0 overflow-hidden">
    
    <!-- BARRA DE BÚSQUEDA Y CATEGORÍAS -->
    <div class="bg-white p-2.5 rounded-2xl border border-stone-200 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-2 shrink-0">
      <div class="relative w-full sm:w-80">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"></i>
        <input type="text" id="busqueda-input" oninput="filtrarProductos()" placeholder="Buscar por nombre, código o SKU..." class="w-full pl-9 pr-3 py-1.5 bg-stone-50 border border-stone-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-[#1b7a4a]">
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto scrollbar-none">
        <div class="flex items-center gap-1.5" id="pills-catalogo-categorias">
          <!-- Categorías dinámicas -->
        </div>
        <button type="button" onclick="abrirModalNuevaCategoria()" class="px-3 py-1.5 rounded-xl bg-emerald-50 text-[#1b7a4a] border border-emerald-300 font-bold text-xs flex items-center gap-1 hover:bg-emerald-100 whitespace-nowrap shadow-xs">
          <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i>
          <span>+ Categoría</span>
        </button>
      </div>
    </div>

    <!-- LISTA DE PRODUCTOS CON SCROLL INDEPENDIENTE -->
    <div class="flex-1 bg-white rounded-2xl border border-stone-200 shadow-sm p-4 overflow-y-auto min-h-0">
      <div id="lista-catalogo-productos" class="space-y-2">
        <!-- Renderizado dinámico -->
      </div>
    </div>

    <!-- BARRA INFORMATIVA DE ESTADO -->
    <div class="bg-white/80 backdrop-blur rounded-xl px-4 py-2 border border-stone-200 flex items-center justify-between text-xs text-stone-500 shrink-0">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span id="catalogo-contador-label" class="font-medium text-stone-700">0 Artículos en Catálogo</span>
      </div>
      <span class="text-stone-400">Stock sincronizado con TPV Ventas</span>
    </div>
  </main>

  <!-- BARRA INFERIOR DE NAVEGACIÓN UNIFICADA (IDÉNTICA A INDEX) -->
  <footer class="bg-white border-t border-stone-200 px-5 py-2 flex items-center justify-between shadow-md shrink-0">
    <div class="flex items-center gap-6">
      <a href="index.html" class="flex items-center gap-1.5 text-stone-500 hover:text-stone-800 font-semibold text-xs">
        <i data-lucide="calculator" class="w-3.5 h-3.5"></i>
        <span>Ventas TPV</span>
      </a>
      <a href="03-tickets-mesas.html" class="flex items-center gap-1.5 text-stone-500 hover:text-stone-800 font-semibold text-xs">
        <i data-lucide="receipt" class="w-3.5 h-3.5"></i>
        <span>Tickets Abiertos</span>
      </a>
      <a href="04-plano-mesas.html" class="flex items-center gap-1.5 text-stone-500 hover:text-stone-800 font-semibold text-xs">
        <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
        <span>Plano de Mesas</span>
      </a>
      <a href="05-cierre-caja.html" class="flex items-center gap-1.5 text-stone-500 hover:text-stone-800 font-semibold text-xs">
        <i data-lucide="banknote" class="w-3.5 h-3.5"></i>
        <span>Caja / Turno</span>
      </a>
      <a href="10-catalogo-stock.html" class="flex items-center gap-1.5 text-[#1b7a4a] font-bold text-xs bg-emerald-50 px-2.5 py-1 rounded-xl border border-emerald-200">
        <i data-lucide="package" class="w-3.5 h-3.5"></i>
        <span>Catálogo</span>
      </a>
    </div>
    <div class="text-[11px] text-stone-400 flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
      <span>Terminal Conectada • Venta Directa</span>
    </div>
  </footer>

  <!-- MODAL: NUEVA CATEGORÍA -->
  <div id="modal-categoria" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl border border-stone-200">
      <div class="flex items-center justify-between border-b border-stone-100 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-emerald-100 flex items-center justify-center text-[#1b7a4a]">
            <i data-lucide="folder-plus" class="w-4 h-4"></i>
          </div>
          <h2 class="font-bold text-sm text-stone-900">Nueva Categoría</h2>
        </div>
        <button type="button" onclick="cerrarModalNuevaCategoria()" class="p-1 rounded-lg bg-stone-100 text-stone-400 hover:text-stone-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-stone-700 mb-1">Nombre *</label>
          <input type="text" id="cat-nombre" placeholder="Ej: Cafés, Panadería..." class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs focus:ring-2 focus:ring-[#1b7a4a] outline-none">
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button type="button" onclick="cerrarModalNuevaCategoria()" class="flex-1 py-2 rounded-xl bg-stone-100 text-stone-700 font-bold text-xs">Cancelar</button>
        <button type="button" onclick="guardarCategoria()" class="flex-1 py-2 rounded-xl bg-[#1b7a4a] text-white font-bold text-xs">Guardar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: NUEVO ARTÍCULO -->
  <div id="modal-articulo" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl border border-stone-200">
      <div class="flex items-center justify-between border-b border-stone-100 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-emerald-100 flex items-center justify-center text-[#1b7a4a]">
            <i data-lucide="package-plus" class="w-4 h-4"></i>
          </div>
          <h2 class="font-bold text-sm text-stone-900">Nuevo Artículo</h2>
        </div>
        <button type="button" onclick="cerrarModalNuevoArticulo()" class="p-1 rounded-lg bg-stone-100 text-stone-400 hover:text-stone-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-stone-700 mb-1">Nombre del Producto *</label>
          <input type="text" id="art-nombre" placeholder="Ej: Café con leche" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs focus:ring-2 focus:ring-[#1b7a4a] outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">PVP Venta (€) *</label>
            <input type="number" step="0.01" id="art-precio" placeholder="1.80" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs focus:ring-2 focus:ring-[#1b7a4a] outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">Categoría</label>
            <select id="art-categoria" class="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs focus:ring-2 focus:ring-[#1b7a4a] outline-none"></select>
          </div>
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button type="button" onclick="cerrarModalNuevoArticulo()" class="flex-1 py-2 rounded-xl bg-stone-100 text-stone-700 font-bold text-xs">Cancelar</button>
        <button type="button" onclick="guardarArticulo()" class="flex-1 py-2 rounded-xl bg-[#1b7a4a] text-white font-bold text-xs">Guardar Artículo</button>
      </div>
    </div>
  </div>

  <script>
    let categoriaActiva = 'TODOS';

    function obtenerCategorias() {
      try { return JSON.parse(localStorage.getItem('lapiruleta_categorias') || '[]'); } catch (e) { return []; }
    }
    function obtenerProductos() {
      try { return JSON.parse(localStorage.getItem('lapiruleta_productos') || '[]'); } catch (e) { return []; }
    }

    function abrirModalNuevaCategoria() {
      document.getElementById('modal-categoria').classList.remove('hidden');
    }
    function cerrarModalNuevaCategoria() {
      document.getElementById('modal-categoria').classList.add('hidden');
      document.getElementById('cat-nombre').value = '';
    }
    function guardarCategoria() {
      const input = document.getElementById('cat-nombre');
      const nombre = (input.value || '').trim();
      if (!nombre) return alert('Escribe un nombre de categoría');
      let cats = obtenerCategorias();
      if (cats.some(c => c.nombre.toLowerCase() === nombre.toLowerCase())) return alert('Ya existe esta categoría');
      cats.push({ id: 'cat_' + Date.now(), nombre: nombre, color: '#1b7a4a' });
      localStorage.setItem('lapiruleta_categorias', JSON.stringify(cats));
      cerrarModalNuevaCategoria();
      renderizar();
    }

    function abrirModalNuevoArticulo() {
      const select = document.getElementById('art-categoria');
      const cats = obtenerCategorias();
      select.innerHTML = cats.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('') || '<option value="General">General</option>';
      document.getElementById('modal-articulo').classList.remove('hidden');
    }
    function cerrarModalNuevoArticulo() {
      document.getElementById('modal-articulo').classList.add('hidden');
      document.getElementById('art-nombre').value = '';
      document.getElementById('art-precio').value = '';
    }
    function guardarArticulo() {
      const nom = document.getElementById('art-nombre').value.trim();
      const pre = document.getElementById('art-precio').value;
      const cat = document.getElementById('art-categoria').value || 'General';
      if (!nom || !pre) return alert('Completa los campos obligatorios');
      let prods = obtenerProductos();
      prods.push({ id: 'prod_' + Date.now(), nombre: nom, precio: parseFloat(pre).toFixed(2), categoria: cat });
      localStorage.setItem('lapiruleta_productos', JSON.stringify(prods));
      cerrarModalNuevoArticulo();
      renderizar();
    }

    function eliminarArticulo(id) {
      if (!confirm('¿Eliminar este artículo?')) return;
      let prods = obtenerProductos().filter(p => p.id !== id);
      localStorage.setItem('lapiruleta_productos', JSON.stringify(prods));
      renderizar();
    }

    function renderizar() {
      const contenedorPills = document.getElementById('pills-catalogo-categorias');
      const cats = obtenerCategorias();
      let htmlPills = `<button onclick="filtrarCat('TODOS')" class="px-3 py-1.5 rounded-xl ${categoriaActiva === 'TODOS' ? 'bg-[#1b7a4a] text-white' : 'bg-stone-100 text-stone-700'} text-xs font-bold whitespace-nowrap">Todos (${obtenerProductos().length})</button>`;
      cats.forEach(c => {
        const cant = obtenerProductos().filter(p => p.categoria === c.nombre).length;
        htmlPills += `<button onclick="filtrarCat('${c.nombre}')" class="px-3 py-1.5 rounded-xl ${categoriaActiva === c.nombre ? 'bg-[#1b7a4a] text-white' : 'bg-stone-50 border border-stone-200 text-stone-700'} text-xs font-bold whitespace-nowrap">${c.nombre} (${cant})</button>`;
      });
      contenedorPills.innerHTML = htmlPills;

      const list = document.getElementById('lista-catalogo-productos');
      const busq = (document.getElementById('busqueda-input').value || '').toLowerCase();
      let prods = obtenerProductos();
      document.getElementById('catalogo-contador-label').textContent = `${prods.length} Artículos en Catálogo`;

      if (categoriaActiva !== 'TODOS') prods = prods.filter(p => p.categoria === categoriaActiva);
      if (busq) prods = prods.filter(p => p.nombre.toLowerCase().includes(busq));

      if (prods.length === 0) {
        list.innerHTML = `<div class="py-12 text-center text-xs text-stone-400">No hay productos en esta sección. Pulsa en "+ Nuevo Artículo" arriba.</div>`;
      } else {
        list.innerHTML = prods.map(p => `
          <div class="p-3 bg-stone-50 hover:bg-stone-100/70 border border-stone-200 rounded-xl flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-white border border-stone-200 flex items-center justify-center text-[#1b7a4a]">
                <i data-lucide="coffee" class="w-4 h-4"></i>
              </div>
              <div>
                <h4 class="font-bold text-xs text-stone-900">${p.nombre}</h4>
                <span class="text-[10px] bg-stone-200/70 text-stone-600 px-2 py-0.5 rounded-md font-medium">${p.categoria}</span>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-extrabold text-sm text-[#1b7a4a]">${p.precio} €</span>
              <button onclick="eliminarArticulo('${p.id}')" class="p-1.5 text-stone-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 transition-colors">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        `).join('');
      }
      lucide.createIcons();
    }

    function filtrarCat(cat) { categoriaActiva = cat; renderizar(); }
    function filtrarProductos() { renderizar(); }

    renderizar();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.warn);
      });
    }
  </script>
</body>
</html>

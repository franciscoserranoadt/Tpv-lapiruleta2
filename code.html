<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>La Piruleta TPV - Ventas</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Epilogue', sans-serif; -webkit-tap-highlight-color: transparent; }</style>
</head>
<body class="bg-[#fff8f5] text-stone-800 antialiased select-none pb-24">
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-stone-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <a href="03-tickets-mesas.html" class="p-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </a>
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="font-bold text-xs text-stone-900">Caja 1 • Turno Abierto</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="13-config-impresoras.html" class="p-2 rounded-xl bg-stone-100 text-stone-700">
        <i data-lucide="printer" class="w-5 h-5"></i>
      </a>
      <div class="w-8 h-8 rounded-full bg-[#1b7a4a] text-white flex items-center justify-center font-bold text-xs">SM</div>
    </div>
  </header>

  <main class="p-3 max-w-lg mx-auto space-y-3">
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-stone-400"></i>
      <input type="text" placeholder="Buscar producto o código..." class="w-full pl-9 pr-4 py-2.5 bg-white border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#1b7a4a]">
    </div>

    <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
      <button class="px-3.5 py-1.5 rounded-lg bg-stone-900 text-white text-xs font-bold whitespace-nowrap">Todos (24)</button>
      <button class="px-3.5 py-1.5 rounded-lg bg-white border border-stone-200 text-stone-600 text-xs font-semibold whitespace-nowrap">☕ Cafetería (8)</button>
      <button class="px-3.5 py-1.5 rounded-lg bg-white border border-stone-200 text-stone-600 text-xs font-semibold whitespace-nowrap">🥐 Bollería (6)</button>
      <button class="px-3.5 py-1.5 rounded-lg bg-white border border-stone-200 text-stone-600 text-xs font-semibold whitespace-nowrap">🥖 Panadería (4)</button>
    </div>

    <div class="grid grid-cols-2 gap-2.5">
      <div class="bg-white p-3 rounded-2xl border border-stone-200/80 shadow-sm flex flex-col justify-between active:scale-95 transition-transform cursor-pointer">
        <div>
          <span class="text-[10px] bg-stone-100 text-stone-600 px-2 py-0.5 rounded-md font-medium">Café Arábica</span>
          <h3 class="font-bold text-sm text-stone-900 mt-1">Café con leche</h3>
        </div>
        <div class="flex items-center justify-between mt-3">
          <span class="font-extrabold text-[#1b7a4a] text-base">1,70 €</span>
          <span class="w-7 h-7 rounded-full bg-emerald-50 text-[#1b7a4a] flex items-center justify-center font-bold text-lg">+</span>
        </div>
      </div>

      <div class="bg-white p-3 rounded-2xl border border-stone-200/80 shadow-sm flex flex-col justify-between active:scale-95 transition-transform cursor-pointer">
        <div>
          <span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-md font-medium">14 disp.</span>
          <h3 class="font-bold text-sm text-stone-900 mt-1">Croissant Mantequilla</h3>
        </div>
        <div class="flex items-center justify-between mt-3">
          <span class="font-extrabold text-[#1b7a4a] text-base">1,90 €</span>
          <span class="w-7 h-7 rounded-full bg-emerald-50 text-[#1b7a4a] flex items-center justify-center font-bold text-lg">+</span>
        </div>
      </div>

      <div class="bg-white p-3 rounded-2xl border border-stone-200/80 shadow-sm flex flex-col justify-between active:scale-95 transition-transform cursor-pointer">
        <div>
          <span class="text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded-md font-medium">8 disp.</span>
          <h3 class="font-bold text-sm text-stone-900 mt-1">Napolitana Chocolate</h3>
        </div>
        <div class="flex items-center justify-between mt-3">
          <span class="font-extrabold text-[#1b7a4a] text-base">2,20 €</span>
          <span class="w-7 h-7 rounded-full bg-emerald-50 text-[#1b7a4a] flex items-center justify-center font-bold text-lg">+</span>
        </div>
      </div>

      <div class="bg-white p-3 rounded-2xl border border-stone-200/80 shadow-sm flex flex-col justify-between active:scale-95 transition-transform cursor-pointer">
        <div>
          <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-md font-medium">Aceite AOVE</span>
          <h3 class="font-bold text-sm text-stone-900 mt-1">Tostada Jamón Ibérico</h3>
        </div>
        <div class="flex items-center justify-between mt-3">
          <span class="font-extrabold text-[#1b7a4a] text-base">3,80 €</span>
          <span class="w-7 h-7 rounded-full bg-emerald-50 text-[#1b7a4a] flex items-center justify-center font-bold text-lg">+</span>
        </div>
      </div>
    </div>
  </main>

  <div class="fixed bottom-14 left-0 right-0 p-3 bg-white/95 backdrop-blur border-t border-stone-200 shadow-md">
    <div class="max-w-lg mx-auto flex items-center justify-between gap-3">
      <a href="03-tickets-mesas.html" class="flex items-center gap-2 bg-stone-100 px-3.5 py-2.5 rounded-xl text-stone-700 font-bold text-xs">
        <i data-lucide="receipt" class="w-4 h-4"></i>
        <span>Mesa 4 • 3 arts.</span>
      </a>
      <a href="02-cobro-pagos.html" class="flex-1 bg-[#1b7a4a] hover:bg-[#15613b] text-white py-2.5 px-4 rounded-xl flex items-center justify-between font-bold text-sm shadow">
        <span>COBRAR</span>
        <span class="bg-white/20 px-2 py-0.5 rounded-lg text-sm">6,50 € ➔</span>
      </a>
    </div>
  </div>

  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-stone-200 px-3 py-2 flex items-center justify-around">
    <a href="index.html" class="flex flex-col items-center gap-0.5 text-[#1b7a4a]">
      <i data-lucide="calculator" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold">Ventas</span>
    </a>
    <a href="03-tickets-mesas.html" class="flex flex-col items-center gap-0.5 text-stone-400 hover:text-stone-700">
      <i data-lucide="receipt" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Tickets</span>
    </a>
    <a href="04-plano-mesas.html" class="flex flex-col items-center gap-0.5 text-stone-400 hover:text-stone-700">
      <i data-lucide="layout-grid" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Mesas</span>
    </a>
    <a href="10-catalogo-stock.html" class="flex flex-col items-center gap-0.5 text-stone-400 hover:text-stone-700">
      <i data-lucide="package" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Catálogo</span>
    </a>
    <a href="05-cierre-caja.html" class="flex flex-col items-center gap-0.5 text-stone-400 hover:text-stone-700">
      <i data-lucide="banknote" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium">Caja</span>
    </a>
  </nav>

  <script>
    lucide.createIcons();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
